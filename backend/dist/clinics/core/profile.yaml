# Профиль по умолчанию. Профиль сети (nets/<slug>/profile.yaml) переопределяет
# любые поля; объекты сливаются, списки и строки заменяются целиком.

# Движок диалога: tools — модель с инструментами (текущий), pipeline — новый пайплайн.
engine: tools

# Модель по умолчанию для сети (если не задана в запросе). Пусто — CHAT_DEFAULT_PROVIDER.
llm: {}

features:
  # Спрашивать «первичный или повторный приём», если у врача есть такие услуги.
  visitTypeQuestion: true
  # Услуга по направлению (self_booking = false): operator — заявка администратору,
  # doctor — только предложить запись к врачу, off — сообщить, что запись по телефону.
  referralFlow: operator
  # Цена: always — показывать в слотах и сводке; on_request — если спросили; never.
  showPrices: on_request
  # Приём без записи: yes / no / unknown (unknown — предложить позвонить в клинику).
  walkIn: unknown
  # Типы вопросов, на которые отвечает пайплайн без агента.
  questions: [schedule, price, address, hours, walk_in, has_service, preparation]

# Данные, которые спрашиваются у гостя перед записью.
patientFields: [fullName, phone, birthday]

# Синонимы для поиска услуг и специальностей: слово пациента → как называется в каталоге.
# Общие для всех сетей; профиль сети добавляет свои (объекты сливаются по ключам).
synonyms:
  окулист: [офтальмолог]
  глазной: [офтальмолог]
  глазник: [офтальмолог]
  кожник: [дерматолог, дерматовенеролог]
  зубной: [стоматолог]
  дантист: [стоматолог]
  лор: [оториноларинголог, отоларинголог]
  ухогорлонос: [оториноларинголог]
  узи: [ультразвуковое исследование, ультразвуковая]
  мрт: [магнитно-резонансная томография]
  кт: [компьютерная томография]
  экг: [электрокардиография, электрокардиограмма]
  фгдс: [эзофагогастродуоденоскопия, гастроскопия]

# Симптом → специальность (поиск по каталогу). Первое совпадение выигрывает.
symptomHints:
  - match: [живот, тошн, изжог, желуд, кишеч, стул]
    speciality: гастроэнтеролог
    fallback: терапевт
  - match: [голов, спин, поясниц, шея, онемен, мигрен]
    speciality: невролог
  - match: [горл, ухо, уши, нос, насмор, гаймор]
    speciality: оториноларинголог
  - match: [кашл, температур, простуд, давлен, слабост]
    speciality: терапевт

# Области исследования — если по запросу слишком много услуг («МРТ», «КТ»), сначала спросить область.
# match — части слов в названии услуги (без описания в скобках), нижний регистр.
serviceAreas:
  - label: Голова и мозг
    match: [мозг, голов, гипофиз, орбит, височн, пазух, лицев, челюст, носоглот]
  - label: Шея
    match: [шеи, гортан, щитовид]
  - label: Позвоночник
    match: [позвоночник, миелограф]
  - label: Суставы и кости
    match: [сустав, кост, стоп, голен, бедр, плеч, кисти, сочленен, рёбер, ребер]
  - label: Грудная клетка и лёгкие
    match: [грудной клетки, лёгк, легк, ангиопульмон]
  - label: Брюшная полость и почки
    match: [брюшн, забрюшин, почк, надпочечн, мочевыдел, урограф, печен, холанг]
  - label: Малый таз
    match: [малого таза, простат, мошонк, мужского таза]
  - label: Сосуды
    match: [артери, вен , вен), ангиограф, аорт, сосуд]

# Тексты шаблонных ответов (переопределяют core/templates).
templates: {}

# Справка о сети для ответов на вопросы (часы работы, парковка и т. п.).
info:
  about: ''
  hours: ''
  phone: ''
