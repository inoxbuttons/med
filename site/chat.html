<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат-помощник</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #2493f9;
      color: #fff;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-header svg { flex-shrink: 0; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.bot {
      background: #fff;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .msg.user {
      background: #2493f9;
      color: #fff;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }

    .msg.typing {
      background: #fff;
      align-self: flex-start;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .dots { display: flex; gap: 4px; padding: 2px 0; }
    .dots span {
      width: 7px; height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .chat-input-area {
      padding: 12px;
      background: #fff;
      border-top: 1px solid #e8ecf0;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-input-area input {
      flex: 1;
      border: 1.5px solid #d0d7de;
      border-radius: 22px;
      padding: 9px 16px;
      font-size: 13px;
      outline: none;
      transition: border-color .2s;
    }
    .chat-input-area input:focus { border-color: #2493f9; }

    .chat-input-area button {
      background: #2493f9;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .2s;
    }
    .chat-input-area button:hover { background: #0385d1; }
    .chat-input-area button:disabled { background: #c0d8f7; cursor: not-allowed; }

  </style>
</head>
<body>

<div class="chat-header">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
  </svg>
  Помощник клиники «XXI Век»
</div>

<div class="chat-messages" id="messages"></div>

<div class="chat-input-area">
  <input type="text" id="userInput" placeholder="Напишите сообщение…" autocomplete="off">
  <button id="sendBtn" onclick="sendMessage()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
      <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
    </svg>
  </button>
</div>

<script>
  const _params = new URLSearchParams(window.location.search);
  const SESSION_ID   = _params.get('session')      || 'site-' + Math.random().toString(36).slice(2, 9);
  const CLIENT_ID    = _params.get('clientId') ? Number(_params.get('clientId')) : null;
  const CLINIC_NET_ID = _params.get('clinicNetId') ? Number(_params.get('clinicNetId')) : null;
  const API = 'http://localhost:3000/chat/message';
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.id = 'typing';
    div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId: SESSION_ID,
          message: text,
          provider: 'gigachat',
          ...(CLIENT_ID     ? { clientId: CLIENT_ID }         : {}),
          ...(CLINIC_NET_ID ? { clinicNetId: CLINIC_NET_ID }  : {}),
        })
      });
      const data = await res.json();
      removeTyping();
      addMessage(data.reply || 'Нет ответа', 'bot');
    } catch (e) {
      removeTyping();
      addMessage('Ошибка подключения к серверу', 'bot');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Приветствие
  setTimeout(() => {
    addMessage('Здравствуйте! Я помощник клиники «XXI Век». Помогу вам записаться к врачу, узнать расписание или задать вопрос об услугах. Чем могу помочь?', 'bot');
  }, 400);
</script>
</body>
</html>
