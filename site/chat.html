<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат-помощник</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #2493f9;
      color: #fff;
      padding: 0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-header svg { flex-shrink: 0; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.bot {
      background: #fff;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .msg.user {
      background: #2493f9;
      color: #fff;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }

    .msg.typing {
      background: #fff;
      align-self: flex-start;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .dots { display: flex; gap: 4px; padding: 2px 0; }
    .dots span {
      width: 7px; height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .chat-input-area {
      padding: 12px;
      background: #fff;
      border-top: 1px solid #e8ecf0;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-input-area input {
      flex: 1;
      border: 1.5px solid #d0d7de;
      border-radius: 22px;
      padding: 9px 16px;
      font-size: 16px;
      outline: none;
      transition: border-color .2s;
    }
    .chat-input-area input:focus { border-color: #2493f9; }

    .chat-input-area button {
      background: #2493f9;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .2s;
    }
    .chat-input-area button:hover { background: #0385d1; }
    .chat-input-area button:disabled { background: #c0d8f7; cursor: not-allowed; }

    .suggestions {
      padding: 8px 12px 0;
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      background: #fff;
      flex-shrink: 0;
    }
    .suggestions:empty { display: none; }
    .suggestion-btn {
      background: #fff;
      border: 1.5px solid #2493f9;
      color: #2493f9;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .suggestion-btn:hover { background: #2493f9; color: #fff; }

    .msg.bot ul, .msg.bot ol { margin: 6px 0 6px 20px; padding: 0; }
    .msg.bot ul { list-style: disc; }
    .msg.bot ol { list-style: decimal; }
    .msg.bot li { margin: 2px 0; display: list-item; }
    .msg.bot p { margin: 4px 0; }
    .msg.bot p:first-child { margin-top: 0; }
    .msg.bot p:last-child { margin-bottom: 0; }
    .msg.bot strong { font-weight: 700; }

  </style>
</head>
<body>

<div class="chat-header">
</div>

<div class="chat-messages" id="messages"></div>

<div class="suggestions" id="suggestions"></div>
<div class="chat-input-area">
  <input type="text" id="userInput" placeholder="Напишите сообщение…" autocomplete="off">
  <button id="sendBtn" onclick="sendMessage()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
      <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
    </svg>
  </button>
</div>

<script>
  const _params = new URLSearchParams(window.location.search);
  const SESSION_ID    = _params.get('session')      || 'site-' + Math.random().toString(36).slice(2, 9);
  const CLINIC_NET_ID = _params.get('clinicNetId') ? Number(_params.get('clinicNetId')) : null;
  const MIS_TYPE      = _params.get('misType')     || null;
  // Зашифрованные данные пациента — передаются один раз на первом запросе
  let _encryptedPatient = null;
  try {
    const raw = _params.get('client-data');
    if (raw) _encryptedPatient = JSON.parse(raw);
  } catch (e) { /* ignore */ }
  const _isLocal = window.location.protocol === 'file:' ||
                   (window.location.hostname === 'localhost' && window.location.port === '');
  const API = _isLocal ? 'http://localhost:3000/chat/message' : '/api/chat/message';
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const suggestionsEl = document.getElementById('suggestions');

  function detectSuggestions(text) {
    if (/подтверждаете перенос/i.test(text)) return ['Да, перенести', 'Нет'];
    if (/подтверждаете отмену/i.test(text)) return ['Да, отменить', 'Нет'];
    if (/подтверждаете запись/i.test(text)) return ['Подтверждаю', 'Нет'];
    if (/заменить.*оставить|оставить.*заменить|заменить старую|оставить обе/i.test(text)) return ['Заменить', 'Оставить обе'];
    return [];
  }

  function renderSuggestions(suggestions) {
    suggestionsEl.innerHTML = '';
    suggestions.forEach(label => {
      const btn = document.createElement('button');
      btn.className = 'suggestion-btn';
      btn.textContent = label;
      btn.onclick = () => { sendText(label); };
      suggestionsEl.appendChild(btn);
    });
  }

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (role === 'bot') {
      div.innerHTML = marked.parse(text);
    } else {
      div.textContent = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.id = 'typing';
    div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendText(text) {
    if (!text) return;
    renderSuggestions([]);
    addMessage(text, 'user');
    input.value = '';
    sendBtn.disabled = true;
    showTyping();

    try {
      // Передаём encryptedPatient только один раз (на первом запросе), затем обнуляем
      const encryptedPatient = _encryptedPatient;
      _encryptedPatient = null;

      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId: SESSION_ID,
          message: text,
          provider: 'gigachat',
          ...(CLINIC_NET_ID      ? { clinicNetId: CLINIC_NET_ID }      : {}),
          ...(MIS_TYPE           ? { misType: MIS_TYPE }               : {}),
          ...(encryptedPatient   ? { encryptedPatient }                : {}),
        })
      });
      const data = await res.json();
      removeTyping();
      const reply = data.reply || 'Нет ответа';
      addMessage(reply, 'bot');
      renderSuggestions(detectSuggestions(reply));
    } catch (e) {
      removeTyping();
      addMessage('Ошибка подключения к серверу', 'bot');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function sendMessage() {
    sendText(input.value.trim());
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Приветствие
  setTimeout(() => {
    addMessage('Здравствуйте! Я помощник клиники «XXI Век». Помогу вам записаться к врачу, узнать расписание или задать вопрос об услугах. Чем могу помочь?', 'bot');
  }, 400);
</script>
</body>
</html>
